version: '3.8'
services:
  cockroach:
    image: cockroachdb/cockroach:v24.3.0
    command: start-single-node --insecure
    ports: ["127.0.0.1:26257:26257", "127.0.0.1:8082:8080"]
    volumes: [cockroachdata:/cockroach/cockroach-data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
volumes:
  cockroachdata:
